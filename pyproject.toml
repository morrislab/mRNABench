[project]
name = "mrna-bench"
version = "2.0.0"
description = "Benchmarking suite for mRNA property prediction."
readme = "README.md"
authors = [
    { name = "Ruian (Ian) Shi", email = "ian.shi@mail.utoronto.ca" },
    { name = "Taykhoom Dalal", email = "tid4007@med.cornell.edu" },
    { name = "Phil Fradkin", email = "phil.fradkin@gmail.com" },
    { name = "Divya Koyyalagunta", email = "dko4001@med.cornell.edu" }
]
requires-python = ">= 3.12"
license = { file = "LICENSE" }  # Include a LICENSE file in your repo
keywords = ["mrna", "genomic foundation model", "benchmark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: Unix"
]
dependencies = [
    "tqdm",
    "PyYAML",
    "scikit-learn",
    "numpy==2.4.3",
    "pandas==3.0.1",
    "requests",
    "pyarrow==20.0.0",
    "datasets>2.15.0",
    "fastparquet",
    "openpyxl",
    "h5py",
]

[project.urls]
Repository = "https://github.com/morrislab/mRNABench"

[project.optional-dependencies]
base_models = [
    "torch==2.7.1",
    "transformers==4.57.6",
    "transformer_engine[pytorch]==2.5.0",
    "flash-attn==2.7.4.post1",
    "mamba-ssm==2.2.5",
    "accelerate==1.8.1",
    "borzoi-pytorch==0.4.2",
    "enformer-pytorch==0.8.10",
    "alphagenome-pytorch==0.3.1",
    "ViennaRNA==2.7.0"
]
dev = [
    "mypy",
    "flake8",
    "flake8-docstrings",
    "pytest",
    "types-requests",
    "types-PyYAML",
    "genomekit==7.4.5"
]
fine_tune = [
    "torch==2.7.1",
    "peft==0.13.0",
    "scipy",
]

[build-system]
requires = [
    "setuptools",
    "wheel",
    "pip"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mrna_bench*"]

[tool.mypy]
packages = ["mrna_bench"]
exclude = ["tests", "scripts", "experiments"]
ignore_missing_imports = true

[tool.ruff]
line-length = 79
